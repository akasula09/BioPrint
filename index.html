<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioPrint Vault — Diagnostic Analysis Engine</title>
    <!-- Core Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg-base: #090d16;
            --bg-surface: #111827;
            --border: #1f2937;
            --accent-primary: #10b981;
            --accent-alert: #f43f5e;
            --accent-warning: #f59e0b;
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
        }

        /* Top Navigation */
        header {
            border-bottom: 1px solid var(--border);
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 0.875rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 1.125rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--text-main);
        }

        .brand span { color: var(--accent-primary); }

        .system-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .indicator-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--accent-primary);
        }

        /* App Layout */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            flex: 1;
        }

        @media (min-width: 900px) {
            main { grid-template-columns: 4fr 7fr; }
        }

        .panel {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 1.25rem;
            margin-bottom: 1rem;
        }

        .panel-header {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* File Upload Drop Area */
        .drop-zone {
            border: 1px dashed var(--border);
            border-radius: 0.375rem;
            padding: 2rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.15s ease, background-color 0.15s ease;
            background: rgba(0, 0, 0, 0.2);
        }

        .drop-zone:hover {
            border-color: var(--accent-primary);
            background: rgba(16, 185, 129, 0.03);
        }

        /* Feed & Record Styling */
        .record-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .record-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .badge {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.2rem 0.5rem;
            border-radius: 0.25rem;
            text-transform: uppercase;
        }

        .badge-low { background: rgba(16, 185, 129, 0.1); color: var(--accent-primary); border: 1px solid rgba(16, 185, 129, 0.2); }
        .badge-high { background: rgba(244, 63, 94, 0.1); color: var(--accent-alert); border: 1px solid rgba(244, 63, 94, 0.2); }

        .btn {
            background: var(--bg-base);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.375rem 0.625rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn:hover { background: #1f2937; }

        .alert-banner {
            background: rgba(244, 63, 94, 0.08);
            border: 1px solid rgba(244, 63, 94, 0.2);
            color: #fca5a5;
            padding: 0.625rem 0.75rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .vitals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 0.5rem;
            margin: 0.75rem 0;
        }

        .vital-item {
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: 0.25rem;
            padding: 0.5rem;
            text-align: center;
        }

        .jargon-row {
            font-size: 0.75rem;
            padding: 0.375rem 0;
            border-bottom: 1px solid rgba(31, 41, 55, 0.5);
        }

        .jargon-row:last-child { border-bottom: none; }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-primary);
            transition: width 0.2s ease;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <canvas id="pdfRenderCanvas" class="hidden"></canvas>

    <header>
        <div class="brand">BioPrint <span>Vault</span></div>
        <div class="system-status">
            <span class="indicator-dot"></span>
            <span>Pipeline Online</span>
        </div>
    </header>

    <main>
        <!-- Left Panel: Ingestion & Analytics -->
        <div>
            <section class="panel">
                <div class="panel-header">
                    <span>Document Ingestion</span>
                </div>
                
                <div id="dropZone" class="drop-zone" onclick="document.getElementById('fileInput').click()">
                    <input type="file" id="fileInput" accept="image/*,.pdf" class="hidden" onchange="handleFile(this.files[0])">
                    <p style="font-size: 0.8125rem; font-weight: 500;">Select or drop lab sheet (PDF/Image)</p>
                    <p style="font-size: 0.75rem; color: var(--text-sub); margin-top: 0.25rem;">Client-side rasterization active</p>
                </div>

                <div id="loader" class="hidden" style="margin-top: 1rem;">
                    <div style="display: flex; justify-content: space-between; font-size: 0.75rem; font-family: monospace;">
                        <span id="loaderStatus">Processing...</span>
                        <span id="loaderPercent">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div id="loaderBar" class="progress-fill"></div>
                    </div>
                </div>
            </section>

            <section class="panel">
                <div class="panel-header">
                    <span>Vital Metric Geometry</span>
                </div>
                <div style="background: var(--bg-base); border: 1px solid var(--border); border-radius: 0.25rem; padding: 0.75rem;">
                    <svg viewBox="0 0 500 120" style="width: 100%; height: auto;">
                        <line x1="10" y1="20" x2="490" y2="20" stroke="#1f2937" stroke-dasharray="2 2"/>
                        <line x1="10" y1="60" x2="490" y2="60" stroke="#1f2937" stroke-dasharray="2 2"/>
                        <line x1="10" y1="100" x2="490" y2="100" stroke="#1f2937" stroke-dasharray="2 2"/>
                        <polyline fill="none" stroke="#10b981" stroke-width="2" points="10,90 130,70 250,95 370,40 490,25" />
                        <circle cx="10" cy="90" r="3" fill="#10b981"/>
                        <circle cx="130" cy="70" r="3" fill="#10b981"/>
                        <circle cx="250" cy="95" r="3" fill="#10b981"/>
                        <circle cx="370" cy="40" r="3" fill="#10b981"/>
                        <circle cx="490" cy="25" r="4" fill="#06b6d4"/>
                    </svg>
                </div>
            </section>
        </div>

        <!-- Right Panel: Processing Stream -->
        <div>
            <div style="margin-bottom: 0.75rem; display: flex; justify-content: space-between; align-items: center;">
                <h2 style="font-size: 0.875rem; font-weight: 600;">Diagnostic Feed</h2>
                <span id="feedCount" style="font-size: 0.75rem; color: var(--text-sub);">0 Records</span>
            </div>

            <div id="logsContainer">
                <div class="record-card" style="text-align: center; color: var(--text-sub); font-size: 0.8125rem; padding: 2.5rem 1rem;">
                    No diagnostic data ingested. Upload a file to trigger analysis.
                </div>
            </div>
        </div>
    </main>

    <script>
    if (typeof pdfjsLib !== 'undefined') {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    const SUPABASE_URL = 'https://autdyccwpbxkgyzwlihg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Kx6iR81mnl9OXUmGbfgbOA_PR9Dy2zT';
    
    var dbClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
    let logs = [];

    window.addEventListener('DOMContentLoaded', () => {
        fetchLogs();
        if (dbClient) {
            dbClient
                .channel('public:diagnostic_logs')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'diagnostic_logs' }, payload => {
                    logs.unshift(payload.new);
                    renderLogs();
                })
                .subscribe();
        }
    });

    async function fetchLogs() {
        if (!dbClient) return;
        const { data, error } = await dbClient
            .from('diagnostic_logs')
            .select('*')
            .order('created_at', { ascending: false });

        if (!error && data) {
            logs = data;
            renderLogs();
        }
    }

    function renderLogs() {
        const container = document.getElementById('logsContainer');
        const feedCount = document.getElementById('feedCount');
        if (feedCount) feedCount.innerText = `${logs.length} Records`;

        if (!container || logs.length === 0) return;

        container.innerHTML = logs.map((log, index) => {
            const isHigh = log.urgency_rating >= 4 || log.requires_doctor_flag;
            const jargon = log.jargon_map ? Object.entries(log.jargon_map) : [];
            const vitals = log.vitals || [];

            return `
                <div class="record-card">
                    <div class="record-header">
                        <div>
                            <div style="font-size: 0.875rem; font-weight: 600;">${escapeHtml(log.file_name)}</div>
                            <div style="font-size: 0.7rem; color: var(--text-sub); font-family: monospace;">
                                ${new Date(log.created_at).toISOString().replace('T', ' ').slice(0, 19)}
                            </div>
                        </div>
                        <span class="badge ${isHigh ? 'badge-high' : 'badge-low'}">
                            Urgency ${log.urgency_rating}/5
                        </span>
                    </div>

                    ${log.requires_doctor_flag ? `
                        <div class="alert-banner">
                            <span>Clinical Review Flagged: Anomaly threshold exceeded.</span>
                            <button class="btn" onclick="exportEmergencyReport(${index})">Export Report</button>
                        </div>
                    ` : ''}

                    ${log.summary ? `
                        <div style="background: var(--bg-base); padding: 0.625rem; border-radius: 0.25rem; border: 1px solid var(--border); margin-bottom: 0.625rem;">
                            <p style="font-size: 0.8125rem;">${escapeHtml(log.summary)}</p>
                            <button class="btn" style="margin-top: 0.5rem;" onclick="speakText('${escapeHtml(log.summary)}')">
                                Audio Synthesis
                            </button>
                        </div>
                    ` : ''}

                    ${vitals.length > 0 ? `
                        <div class="vitals-grid">
                            ${vitals.map(v => `
                                <div class="vital-item">
                                    <div style="font-size: 0.65rem; color: var(--text-sub);">${escapeHtml(v.metric)}</div>
                                    <div style="font-size: 0.8125rem; font-weight: 600; font-family: monospace; color: ${v.isAnomaly ? 'var(--accent-alert)' : 'var(--accent-primary)'}">
                                        ${v.value} <span style="font-size: 0.6rem;">${escapeHtml(v.unit)}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}

                    ${jargon.length > 0 ? `
                        <div style="margin-top: 0.625rem; border-top: 1px solid var(--border); padding-top: 0.5rem;">
                            ${jargon.map(([term, def]) => `
                                <div class="jargon-row">
                                    <strong style="color: var(--accent-primary);">${escapeHtml(term)}:</strong> ${escapeHtml(def)}
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
        }).join('');
    }

    async function handleFile(file) {
        if (!file) return;

        const loader = document.getElementById('loader');
        const bar = document.getElementById('loaderBar');
        const percent = document.getElementById('loaderPercent');
        const status = document.getElementById('loaderStatus');

        if (loader) loader.classList.remove('hidden');
        if (bar) bar.style.width = '15%';
        if (percent) percent.innerText = '15%';

        try {
            let base64Image = '';

            if (file.type === 'application/pdf') {
                if (status) status.innerText = 'Rasterizing PDF...';
                base64Image = await convertPdfToImage(file);
            } else {
                if (status) status.innerText = 'Reading payload...';
                base64Image = await readFileAsBase64(file);
            }

            if (bar) bar.style.width = '50%';
            if (percent) percent.innerText = '50%';
            if (status) status.innerText = 'Executing model parser...';

            const res = await fetch('/api/groq', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ base64Image, fileName: file.name })
            });

            const contentType = res.headers.get('content-type');
            let result;

            if (contentType && contentType.includes('application/json')) {
                result = await res.json();
            } else {
                const rawText = await res.text();
                throw new Error(`Server returned status ${res.status}: ${rawText.slice(0, 200)}`);
            }

            if (!res.ok) throw new Error(result.error || 'Processing failed');

            if (bar) bar.style.width = '100%';
            if (percent) percent.innerText = '100%';
            if (status) status.innerText = 'Complete';

            setTimeout(() => { if (loader) loader.classList.add('hidden'); }, 1000);

        } catch (err) {
            alert('Error processing document: ' + err.message);
            if (loader) loader.classList.add('hidden');
        }
    }

    async function convertPdfToImage(file) {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const page = await pdf.getPage(1);

        const viewport = page.getViewport({ scale: 1.5 });
        const canvas = document.getElementById('pdfRenderCanvas') || document.createElement('canvas');
        const context = canvas.getContext('2d');

        canvas.height = viewport.height;
        canvas.width = viewport.width;

        await page.render({ canvasContext: context, viewport: viewport }).promise;
        return canvas.toDataURL('image/png');
    }

    function readFileAsBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.95;
            window.speechSynthesis.speak(utterance);
        }
    }

    function exportEmergencyReport(index) {
        const log = logs[index];
        if (!log) return;
        const reportWindow = window.open('', '_blank');
        reportWindow.document.write(`
            <html>
            <head>
                <title>Diagnostic Brief - ${escapeHtml(log.file_name)}</title>
                <style>
                    body { font-family: system-ui, sans-serif; padding: 20px; line-height: 1.5; color: #111827; }
                    .box { border: 1px solid #e5e7eb; padding: 12px; border-radius: 4px; margin: 12px 0; background: #f9fafb; }
                </style>
            </head>
            <body>
                <h2>BioPrint Diagnostic Summary</h2>
                <p><strong>File:</strong> ${escapeHtml(log.file_name)}</p>
                <p><strong>Timestamp:</strong> ${new Date(log.created_at).toISOString()}</p>
                <p><strong>Urgency Rating:</strong> ${log.urgency_rating} / 5</p>
                <div class="box">
                    <strong>Summary:</strong>
                    <p>${escapeHtml(log.summary)}</p>
                </div>
                <button onclick="window.print()">Print Report</button>
            </body>
            </html>
        `);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
</script>
</body>
</html>
